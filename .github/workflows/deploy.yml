name: Deploy

# Builds only the topics that changed and publishes each into its own folder on the
# gh-pages branch. Other topics are left exactly as they were.
#   - topics/<slug>/**        -> rebuild that topic only
#   - portal/** or topic.json -> rebuild the home page only
#   - shared/** or lockfile   -> rebuild everything (token names are shared)
# Manual run: choose "all", "portal", or a comma list such as "mcp,docker".

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: 'What to deploy: "all", "portal", or topic slugs like mcp,docker'
        required: true
        default: all

# One publish at a time, so two pushes can never write to gh-pages together.
concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      topics: ${{ steps.detect.outputs.topics }}
      portal: ${{ steps.detect.outputs.portal }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/detect-changes.mjs --only "${{ inputs.only }}"
          else
            node scripts/detect-changes.mjs --base "${{ github.event.before }}" --head "${{ github.sha }}"
          fi

  build-topic:
    needs: plan
    if: ${{ needs.plan.outputs.topics != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic: ${{ fromJSON(needs.plan.outputs.topics) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-contract.mjs
      - run: node scripts/build-topic.mjs "${{ matrix.topic }}"
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.topic }}
          path: .out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build-portal:
    needs: plan
    if: ${{ needs.plan.outputs.portal == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-portal.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: out-portal
          path: .out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build-topic, build-portal]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.plan.outputs.topics != '[]' || needs.plan.outputs.portal == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          merge-multiple: true
          path: src/.out

      # Check out the existing gh-pages branch, or start it on the first deploy.
      - name: Prepare gh-pages
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" pages
          else
            mkdir pages && cd pages && git init -b gh-pages && git remote add origin "$REMOTE"
          fi

      - name: Copy only what was built
        run: node src/scripts/publish.mjs --from src/.out --to pages

      - name: Commit and push
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Deploy topics=${{ needs.plan.outputs.topics }} portal=${{ needs.plan.outputs.portal }}"
            git push origin gh-pages
          fi
